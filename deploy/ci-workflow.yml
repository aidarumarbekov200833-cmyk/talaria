name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Секреты ловим ДО всего остального: закоммиченный ключ дороже упавшего
  # теста. История git вычищена 01.09.2026 (ротация + filter-repo), поэтому
  # сканируем её целиком (fetch-depth: 0), а не только свежие коммиты.
  gitleaks:
    name: секреты — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      # ruff format --check и mypy НЕ включены осознательно: на текущем коде это
      # 43 файла к переформату и ~900 ошибок mypy — оба шага были бы красными
      # с первого прогона. Включать отдельным PR, который сначала приводит код
      # в порядок, иначе это «вечно красный» пайплайн, который все игнорируют.

      - name: Тесты
        run: pytest -q

  frontend:
    name: frontend — eslint + unit + контракты + prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Контракт-гейты (DOM/CSS) зовут scripts/contract_gate.py — ему нужен
      # python с зависимостями бэкенда.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Зависимости
        run: |
          npm ci --prefix frontend
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: ESLint
        run: npm run lint --prefix frontend

      - name: Unit-тесты
        run: npm run test:unit --prefix frontend

      - name: Контракты (DOM / CSS)
        run: npm run test:contracts --prefix frontend

      - name: Формат
        run: npm run format:check --prefix frontend

      # inline-обработчики ломают CSP (script-src без unsafe-inline).
      - name: Отсутствие inline-обработчиков (защита CSP)
        working-directory: frontend
        run: |
          n="$(grep -oE 'on(click|change|input|submit|load)=' index.html | wc -l)"
          if [ "$n" -gt 0 ]; then
            echo "Найдено $n inline-обработчиков — используйте data-act= вместо onclick=" >&2
            exit 1
          fi

  tg-mini-client:
    name: tg-mini-client — node --test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg-mini-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tg-mini-client/package-lock.json

      - name: Установить зависимости
        run: npm ci --ignore-scripts

      - name: Тесты
        run: npm test

  compose:
    name: compose — config + nginx -t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          # Обязательные секреты (${VAR:?} в compose) — любые непустые:
          # проверяется синтаксис compose, а не значения.
          printf 'POSTGRES_PASSWORD=ci-only\nUMAMI_DB_PASSWORD=ci-only\nUMAMI_APP_SECRET=ci-only\n' >> .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tls --profile offsite-backup config --quiet
      - name: nginx -t
        run: docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

# ^ Готовый .github/workflows/ci.yml. Бот пушит через GitHub App без права
# `workflows`, поэтому файл лежит здесь: скопируйте его руками поверх
# .github/workflows/ci.yml одним коммитом из своего аккаунта.

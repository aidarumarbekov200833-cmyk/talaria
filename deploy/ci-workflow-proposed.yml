name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Секреты ловим ДО всего остального: закоммиченный ключ дороже упавшего
  # теста. Полная история (fetch-depth: 0) — gitleaks смотрит и старые коммиты.
  gitleaks:
    name: секреты — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest -q

  frontend:
    name: frontend — unit-тесты + prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Unit-тесты
        run: npm run test:unit

      # test:contracts здесь не гоняем: скрипту нужен python-бэкенд с
      # зависимостями — эти гейты выполняются в backend-джобе через pytest.
      - name: Формат
        run: npm run format:check

  tg-mini-client:
    name: tg-mini-client — node --test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg-mini-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tg-mini-client/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Тесты
        run: npm test

# ^ Предлагаемый .github/workflows/ci.yml (gitleaks + frontend + tg-mini-client).
# GitHub App, через который работает бот, не имеет права workflows, поэтому
# файл лежит здесь: скопируйте его руками поверх .github/workflows/ci.yml.

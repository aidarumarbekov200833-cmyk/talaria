# Конфигурация Alembic для Outly.
#
# URL базы сюда НЕ вписываем — env.py берёт его из настроек приложения
# (app.config.settings.database_url), чтобы значение не расходилось с .env.
[alembic]
script_location = alembic
prepend_sys_path = .
# Формат имени файла ревизии: дата + слаг, так миграции сортируются по времени.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

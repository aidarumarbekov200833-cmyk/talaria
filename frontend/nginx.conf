# Зона для лимита на публичный приём аналитики: ручка не требует входа, и без
# ограничения один настойчивый клиент мог бы заливать Umami мусором. Объявление
# вне server — файл включается на уровне http, где и живут limit_req_zone.
limit_req_zone $binary_remote_addr zone=umami_send:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Реальный IP клиента. Перед nginx стоит Caddy (TLS), и без real_ip
    # $remote_addr — адрес контейнера Caddy, один на всех: limit_req по
    # $binary_remote_addr превращался бы в ОБЩИЙ лимит на весь сайт (10 r/s
    # аналитики на всех посетителей разом), а бэкенд получал бы в X-Real-IP
    # адрес прокси. Доверяем только внутренним docker-сетям; клиентский адрес
    # берётся из X-Forwarded-For, который пишет Caddy. recursive: подделанные
    # клиентом элементы слева не доверенные, поэтому не учитываются.
    #
    # СВЯЗКА С БЭКЕНДОМ (не менять по отдельности): после real_ip переменная
    # $remote_addr уже переписана на адрес КЛИЕНТА, поэтому
    # $proxy_add_x_forwarded_for в proxy_set_header ниже дописывает справа не
    # адрес Caddy, а КОПИЮ клиента: бэкенд видит "...,client,client". Его
    # разбор берёт элемент len-TRUSTED_PROXY_HOPS (hops=2 в prod-профиле) и
    # попадает в клиента именно благодаря этой копии. Замена
    # $proxy_add_x_forwarded_for или числа hops поодиночке ломает разбор —
    # см. backend/app/access.py (_forwarded_for).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    # Docker can assign a new address when a service restarts. Resolve service
    # names through Docker DNS on each cache refresh instead of pinning the IP
    # that existed when nginx started.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $outly_backend_host backend;
    set $outly_telegram_host web-tg;
    set $outly_umami_host umami;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP в переменной: заголовок нужен и на уровне server, и в location /,
    # где свой add_header сбрасывает наследование. Одна строка — один источник
    # правды. img-src сужен с «любой https» до хостов, откуда реально приходят
    # картинки: аватарки Telegram (виджет входа и CDN), превью каналов и
    # видео YouTube. Шрифты Google убраны — с v53 шрифты лежат в assets/fonts.
    set $outly_csp "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://t.me https://*.telegram-cdn.org https://*.cdn-telegram.org https://*.ggpht.com https://*.ytimg.com https://*.googleusercontent.com; connect-src 'self' wss:; frame-src 'self' https://oauth.telegram.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $outly_csp always;

    # WebSocket для живой ленты событий. Отдельным location, потому что каналу
    # нужен апгрейд соединения (Upgrade/Connection) и снятый таймаут чтения:
    # сокет подолгу молчит между событиями, и обычные 60 с его бы рвали.
    location ^~ /api/ws {
        # Do not log legacy clients that may still send a JWT query parameter.
        access_log off;
        proxy_pass http://$outly_backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/ {
        # Оффер с альбомом: до 10 картинок по 800 КБ уходят base64-JSON'ом
        # (плюс треть на кодирование). Дефолтный 1 МБ nginx резал такие
        # запросы голым 413 задолго до лимитов бэкенда.
        client_max_body_size 12m;

        proxy_pass http://$outly_backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Клиент здесь ждёт JSON. Если бэкенд не отвечает, nginx сам рисует
        # 502 — и HTML-страница ошибки сломала бы разбор ответа в кабинете
        # («Unexpected token <»). Отдаём понятный JSON.
        error_page 500 502 503 504 = @api_down;
    }

    location @api_down {
        internal;
        default_type application/json;
        return 503 '{"detail":"Сервис временно недоступен, попробуйте через минуту"}';
    }

    # Узкая форма подключения аккаунта (внутренний сервис web-tg/GramJS).
    # Диалоги не отображаются; WebSocket нужен только для phone/code/2FA.
    #
    # Общего пароля на этот адрес больше нет: сессия Telegram у каждого
    # пользователя своя, и решает всё подписанный билет (?t=...), который
    # выдаёт бэкенд вошедшему на сайт. Без билета WebSocket закрывается сразу,
    # так что сама по себе открытая страница не даёт доступа ни к чьим чатам.
    location ^~ /tg-connect/ {
        # URL содержит короткоживущий подписанный билет; не сохраняем его в лог.
        access_log off;
        # Наружу нужны только GET статики и WebSocket Upgrade. Серверные POST
        # /send, /resolve и /contact-candidates доступны лишь backend внутри сети.
        limit_except GET { deny all; }
        # Клиент живёт в iframe на нашей же странице. frame-ancestors 'self' не даёт
        # чужому сайту встроить его к себе и подсунуть человеку чужой Telegram.
        # Наличие add_header в location отменяет наследование серверных
        # заголовков nginx, поэтому полный набор повторён намеренно.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        rewrite ^/tg-connect/(.*)$ /$1 break;
        proxy_pass http://$outly_telegram_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # nginx:alpine не знает расширение .webmanifest и отдаёт его как
    # application/octet-stream — часть браузеров такой манифест игнорирует и
    # иконка «на рабочий стол» не подхватывается.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Аналитика (Umami). Наружу открыты РОВНО две точки: файл трекера и приём
    # событий. Панель со статистикой в интернет не выставлена — она доступна
    # только изнутри docker-сети, поэтому её незачем защищать от перебора
    # паролей и незачем следить за её уязвимостями со стороны сети.
    #
    # Почему не просто `location /insights/` на весь сервис: образ Umami собран
    # под корень сайта и переменную BASE_PATH игнорирует (basePath у Next.js
    # задаётся на сборке). При проксировании подпути панель ссылалась бы на
    # /_next/... в корне нашего домена и не открылась бы.
    #
    # rewrite + proxy_pass без URI — намеренно: когда в proxy_pass есть
    # переменная, nginx не делает обычную подстановку пути, и адрес уехал бы.
    location = /insights/s.js {
        rewrite ^ /script.js break;
        proxy_pass http://$outly_umami_host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /insights/api/send {
        # Публичная ручка без входа — лимит на IP, чтобы аналитику нельзя было
        # дёшево заливать мусором. burst покрывает всплеск при загрузке страниц.
        limit_req zone=umami_send burst=20 nodelay;
        rewrite ^ /api/send break;
        proxy_pass http://$outly_umami_host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Существующие файлы отдаём как есть, а на несуществующие возвращаем честный
    # 404. Раньше всё падало в SPA-заглушку `/index.html`, и любой опечатанный
    # путь — /robots.txt, /favicon.ico, случайный мусор от сканеров — отвечал
    # 200 и всей страницей на 250+ КБ. Поисковик индексировал дубли одной и той
    # же страницы под сотней адресов, а браузер качал её ради фавиконки.
    location ~* \.(?:css|js|mjs|map|txt|xml|json|webmanifest)$ {
        try_files $uri =404;
        # no-cache = «хранить можно, но перед использованием спросить сервер».
        # Без явного заголовка браузеры кешируют эвристически (~10 % возраста
        # файла) и после деплоя часами держали старый CSS при новой разметке:
        # версии ?v= стоят только на верхних файлах, а @import внутри
        # styles.css и часть import в js без версий. Условный запрос с ETag
        # отвечает 304 без тела — дёшево, зато свежесть гарантирована.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Картинки и шрифты: имя файла меняется вместе с содержимым, поэтому их
    # безопасно держать в кеше долго. HTML сюда не попадает и кешироваться не
    # будет — иначе после деплоя люди видели бы старую страницу.
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Всё остальное — маршруты приложения, их разбирает фронтенд.
    location / {
        try_files $uri $uri/ /index.html;
        # HTML всегда перепроверяется: он держит версии ?v= всего остального.
        add_header Cache-Control "no-cache" always;
        # add_header в location отменяет наследование серверных заголовков —
        # набор безопасности повторён целиком (как в /tg-connect/).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $outly_csp always;
    }

    # Свои страницы вместо стандартных серых заглушек nginx. Раньше на 404 и на
    # упавший бэкенд человек видел «404 Not Found / nginx» — по такой странице
    # непонятно даже, тот ли это сайт.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # internal: страницы существуют только как ответ на ошибку. Иначе они
    # открывались бы по прямой ссылке и попадали в поиск.
    location = /404.html {
        internal;
    }
    location = /50x.html {
        internal;
    }
}
